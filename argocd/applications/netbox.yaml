apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox2
  source:
    repoURL: https://charts.netbox.oss.netboxlabs.com/
    chart: netbox
    targetRevision: 7.1.10
    helm:
      releaseName: netbox
      values: |
        global:
          storageClass: truenas-nfs-csi

        # --- 秘密情報は existingSecret 経由（パブリックリポジトリのため実値を保持しない）---
        # netbox-app-secret のキー: secret_key / ldap_bind_password / email_password
        #   （secrets-templates/netbox-app-secret.yaml.example から手動 apply）
        existingSecret: "netbox-app-secret"

        # superuser 認証情報も同じ Secret から読む（username/email/password/api_token キー）
        superuser:
          existingSecret: "netbox-app-secret"

        # --- NetBox コンテナ（プラグインを内包したカスタムイメージを推奨） ---
        image:
          # 例：あなたのレジストリのカスタムイメージ
          registry: ghcr.io
          # repository: netbox-community/netbox
          repository: zinntikumugai/netbox-custom
          # イミュータブルタグで固定（どのイメージが動いているか一意・rollback 確実）。
          # 更新時は image-build ワークフローが出力する新しい <version>-with-plugin-<hash> に差し替える。
          tag: "v4.6.5-5.0.2-with-plugin-58d7c0a"
          # 固定タグのため再取得は不要。イメージ更新はタグ変更（＝git変更）で行う。
          pullPolicy: IfNotPresent
        
        plugins:
          - netbox_diode_plugin
          - netbox_bgp
        pluginsConfig:
          netbox_diode_plugin:
            diode_target_override: "grpc://netbox-diode-ingress.netbox-diode.svc.cluster.local:80/diode"
            diode_username: "diode"
            netbox_to_diode_client_secret: "0123456789"
          netbox_bgp:
            device_ext_page: "right"
            top_level_menu: false

        # --- パフォーマンス設定（OOMKilled対策） ---
        # Unitワーカープロセス数を制限
        unitConfig:
          processes: 2
          max_requests: 500
          
        # --- liveness プローブ上書き（Granian 対応）---
        # netbox-docker 5.0 (NetBox 4.6) はアプリサーバが NGINX Unit から Granian に変更された。
        # チャート 7.1.10 (appVersion 4.4.4) の既定 liveness は Unit 用の
        #   http-get nginx-status:8081 /status/applications/netbox/processes/running
        # を叩くが、Granian には 8081 も当該パスも無いため connection refused → 誤って
        # kill され Pod がクラッシュループする。Granian が listen する http(8080) への
        # TCP チェックに置き換える（/login/ は稀に数秒かかるため timeout に強い TCP を採用）。
        # ※ 恒久的にはチャートを appVersion 4.6.5 系 (8.3.x) へ上げて整合させるのが望ましい。
        customLivenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # --- DB 接続設定 ---
        # 永続接続を無効化（CONN_MAX_AGE=0）。1リクエスト毎に接続を張り直すため、
        # PostgreSQL 再起動などで接続が切れても stale 接続を再利用せず、
        # 長寿命ワーカーが /login/ 等で HTTP 500 を返し続ける問題が原理的に起きない。
        # （チャートは configmap で DATABASES.default.CONN_MAX_AGE を
        #  externalDatabase.connMaxAge から生成する。bundled postgresql でも本値が使われる）
        externalDatabase:
          connMaxAge: 0

        # --- LDAP認証設定 ---
        # 注意: ldap_bind_password は existingSecret "netbox-app-secret" から読み込まれます。
        # 更新するには secrets-templates/netbox-app-secret.yaml.example を編集して
        #   kubectl apply -f <filled>.yaml -n netbox2
        # を実行し、その後 NetBox Deployment / worker を rollout restart してください。
        remoteAuth:
          enabled: true
          backends:
            - netbox.authentication.LDAPBackend
          autoCreateUser: true
          autoCreateGroups: false
          defaultGroups: []
          groupSyncEnabled: true
          superuserGroups: []
          staffGroups: []

          ldap:
            # LDAPサーバー設定（環境に合わせて変更してください）
            # 必ず ldap:// または ldaps:// スキームを付けること。
            # スキームが無いと python-ldap が接続できず全 LDAP ログインが失敗する。
            serverUri: "ldap://ldap.service.z1n.in:389"
            startTls: false
            ignoreCertErrors: false

            # Bind認証情報
            # bindPassword は existingSecret "netbox-app-secret" の ldap_bind_password キーから読み込み
            bindDn: "cn=admin,dc=zin3,dc=cc"

            # ユーザー検索設定
            userSearchBaseDn: "OU=people,DC=zin3,DC=cc"
            # userSearchAttr: "sAMAccountName"  # Active Directoryの場合
            userDnTemplate: "uid=%(user)s,ou=people,dc=zin3,dc=cc"  # 固定DN形式の場合

            # グループ検索設定
            # zin3 の LDAP は posixGroup（メンバーは memberUid）を使用。
            groupSearchBaseDn: "ou=groups,dc=zin3,dc=cc"
            # objectClass 名のみを指定すること（フィルタ全体ではない）。
            # chart の ldap_config.py が (objectClass=<値>) と包むため、
            # ここに "(objectClass=posixGroup)" を入れると
            # (objectClass=(objectClass=posixGroup)) という不正フィルタになり
            # bind 成功後のグループ検索が FILTER_ERROR で失敗しログインが拒否される。
            groupSearchClass: "posixGroup"
            groupType: "PosixGroupType"

            # 権限マッピング
            # 注意（chart 仕様）: is_superuser / is_staff のグループ付与は
            # requireGroupDn が設定されている時のみ有効になる。そのため
            # zin3group を superuser にするには require group にも指定する。
            # 結果として zin3group メンバーのみログイン可・全員 superuser となる。
            requireGroupDn: ["cn=zin3group,ou=groups,dc=zin3,dc=cc"]
            # isAdminDn: ["cn=...,ou=groups,dc=zin3,dc=cc"]
            isSuperUserDn: ["cn=zin3group,ou=groups,dc=zin3,dc=cc"]

            # グループ同期設定
            findGroupPerms: true
            mirrorGroups: true
            mirrorGroupsExcept: []
            cacheTimeout: 3600

            # 属性マッピング
            attrFirstName: "givenName"
            attrLastName: "sn"
            attrMail: "mail"

        # --- NetBoxコンテナのリソース設定 ---
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi

        # --- Worker設定 ---
        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        # --- Housekeeping設定 ---
        housekeeping:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        # --- PostgreSQL subchart設定（PDB重複回避） ---
        postgresql:
          enabled: true
          # 固有ラベルを全リソースに付与
          commonLabels:
            app.z1n.in/stack: netbox
          # 既存Secretからパスワードを読み込む
          auth:
            existingSecret: "netbox-postgresql-auth"
            secretKeys:
              adminPasswordKey: "postgres-password"
              userPasswordKey: "password"
          primary:
            # Podにも固有ラベルを付与
            podLabels:
              app.z1n.in/stack: netbox
              app.z1n.in/component: postgresql
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            # Helmチャートのデフォルトサービスを無効化
            service:
              enabled: false
          # PDB設定（セレクタに固有ラベルを追加）
          pdb:
            create: true
            minAvailable: 1

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
